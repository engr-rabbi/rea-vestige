name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Audit (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 24]
        include:
          # Intended-platform smoke (not yet fully exercised; kept advisory)
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Regression tests
        run: npm run test:regression

      - name: End-to-end tests (real stdio)
        run: npm run test:e2e

      - name: Dependency audit (non-blocking on advisories without fixes)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Secret scan (basic pattern check)
        if: runner.os == 'Linux'
        run: |
          ! grep -rInE "(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})" \
            --include='*.ts' --include='*.js' --include='*.mjs' --include='*.json' --include='*.md' \
            src tests scripts docs 2>/dev/null

  benchmarks:
    name: Accuracy benchmarks (recorded artifacts)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run benchmarks and publish results
        run: npm run bench:record
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            docs/BENCHMARKS.md
            docs/benchmarks-latest.json
